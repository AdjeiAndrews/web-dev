<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tag</title>
</head>
<body>
    <main>
<figure>
        <img src="Merlin.jpg" alt="Chanting Merlin">
        <figcaption>
        Merlin chanting in the forest, surrounded by magical energy and ancient trees. The image captures the mystical atmosphere of the scene, with vibrant colors and intricate details that highlight Merlin's connection to nature and his powerful magic. 
    </figcaption>

    <br>
    <details>
        <summary>
            I am a summary of the details element. Click to expand and see more information about the image above.
        </summary>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Dicta, accusamus nisi in vel voluptatem cum sit saepe quis atque quasi.</p>
    </details>

    <p>We are open from <time>10:00AM</time> to <time>8:00PM</time> every day</p>
    </main>
</body>
</html>
