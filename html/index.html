<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <fieldset >
        <legend>Personal Info</legend>
    <label for="first name">First Name</label>
    <input type="text" id="first name" name="first name">
    <br> 

    <label for="second name">Second Name</label>
    <input type="text" id="second name" name="second name">
    <br>

    <label for="password">Password</label>
    <input type="password" name="password" id="password">
    <br>

    <label for="">Education</label>
    <select name="" id="" size="2" multiple>
        <option value="high school">SHS</option>
        <option value="bachelors">BSc</option>
        <option value="masters" selected>MS</option>
        <option value="ph.d">PH.D</option>
    </select><br>
    <label for="">Message</label>
    <textarea name="" id="" cols="30" rows="15"></textarea>
    </fieldset>
     <button>Click Me</button>
     <input list="browsers">
     <datalist id="browsers">
        <option value="Chrome"></option>
        <option value="Firefox"></option>
        <option value="Safari"></option>
        <option value="Edge"></option>
        <option value="Opera"></option>
     </datalist>
</body>
</html>
