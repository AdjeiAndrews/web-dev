<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <input type="submit" name="submit_btn" value="Submit">
    <input type="reset" name="reset_btn" > <br>

    <label for="">Gender</label>
    <input type="radio" name="gender" value="male" checked>Male
    <input type="radio" name="gender" value="female">Female <br>

    <label for="">Hobbies</label>
    <input type="checkbox" name="soccer" value="soccer">Soccer
    <input type="checkbox" name="basketball" value="basketball">Basketball
    <input type="checkbox" name="netball" value="netball">Netballbr <br>

    <label for="">Select your favorite color</label>
    <input type="color" id="color" name="color"> <br>   

    <label for="">Your Birthday</label>
    <input type="datetime-local" name="dob" max="2025-12-31"> <br>


    <label for="">Your Email</label>
    <input type="email" required> <br>

    <label for="">Upload your Resume</label>
    <input type="file" name="resume"> <br>

    <input type="hidden" value="1"> <br>
    <label for="">Please select a month</label>
    <input type="month" name="month">

    <label for="">Marks</label>
    <input type="number" name="marks" min="50" max="100"> <br>

    <label for="">Select a Range</label>
    <input type="range" min="10" max="100" step="2">

    <label for="">Search</label>
    <input type="search"><br>

    <label for="">Telephone</label>
    <input type="tel" name="telephone"><br>

    <label for="">Time</label>
    <input type="time"> <br>

    <label for="">Website</label>
    <input type="url" name="Website"> <br>

    <label for="">Week</label>
    <input type="week"> <br>

    <input type="image" src="Merlin.jpg" width="100" height="100" alt="Merlin the sorcerer">
</body>
</html>
